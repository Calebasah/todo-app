services:
  # Main todo database
  todo-db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: todo_db
    volumes:
      - pgdata-todo:/var/lib/postgresql/data
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Separate DB for user data
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Separate DB for analytics
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics-db
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: analytics_db
    volumes:
      - pgdata-analytics:/var/lib/postgresql/data
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://todo_user:${DB_PASSWORD}@todo-db:5432/todo_db
      REDIS_URL: redis://redis:6379
    depends_on:
      todo-db:
        condition: service_healthy
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/api/todos"]
      interval: 10s
      timeout: 5s
      retries: 5 
      start_period: 15s 

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"           
    volumes:
      - redis-data:/data
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5    

volumes:
  pgdata-todo:
  pgdata-user:
  pgdata-analytics:
  redis-data:

networks:
  todo-net:
    driver: bridge  